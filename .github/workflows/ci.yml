name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs-version }} / SVG ${{ matrix.svg }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs-version: "31.1"
            svg: true
          - emacs-version: "31.1"
            svg: false
          - emacs-version: snapshot
            svg: false

    steps:
      - uses: actions/checkout@v5

      - uses: purcell/setup-emacs@master
        if: ${{ !matrix.svg }}
        with:
          version: ${{ matrix.emacs-version }}

      - uses: cachix/install-nix-action@v31
        if: matrix.svg

      # Pin the full Emacs build and SVG libraries together; purcell's builds are minimal.
      - name: Install SVG-capable Emacs
        if: matrix.svg
        env:
          EMACS_VERSION: ${{ matrix.emacs-version }}
        run: |
          nix profile install \
            "github:NixOS/nixpkgs/55bfb4d7437bd4e09ab7cba58a43bd68eb310044#emacs31-gtk3"
          emacs --batch -Q \
            --eval '(unless (equal emacs-version (getenv "EMACS_VERSION")) (error "Unexpected Emacs version: %s" emacs-version))' \
            --eval '(unless (image-type-available-p (quote svg)) (error "SVG is unavailable: %s" system-configuration-features))'

      - name: Install Tree-sitter grammars
        run: |
          emacs --batch -Q --eval "(progn
            (require 'treesit)
            (setq treesit-language-source-alist
                  '((markdown
                     \"https://github.com/tree-sitter-grammars/tree-sitter-markdown\"
                     :source-dir \"tree-sitter-markdown/src\")
                    (markdown-inline
                     \"https://github.com/tree-sitter-grammars/tree-sitter-markdown\"
                     :source-dir \"tree-sitter-markdown-inline/src\")
                    (c \"https://github.com/tree-sitter/tree-sitter-c\")))
            (mapc #'treesit-install-language-grammar
                  '(markdown markdown-inline c))
            (unless (treesit-ready-p '(markdown markdown-inline c))
              (error \"Required Tree-sitter grammars are unavailable\")))"

      - name: Install required package dependencies
        run: |
          emacs --batch -Q --eval "(progn
            (require 'package)
            (add-to-list 'package-archives
                         '(\"melpa\" . \"https://melpa.org/packages/\") t)
            (package-refresh-contents)
            (package-install 'markdown-table-wrap)
            (package-install 'evil))"

      - uses: actions/setup-node@v5
        if: matrix.svg
        with:
          node-version: "lts/*"

      - name: Install optional MathJax dependency
        if: matrix.svg
        run: |
          emacs --batch -Q --eval "(progn
            (require 'package)
            (add-to-list 'package-archives
                         '(\"melpa\" . \"https://melpa.org/packages/\") t)
            (package-refresh-contents)
            (package-install 'mathjax)
            (unless (image-type-available-p 'svg)
              (error \"This Emacs build lacks SVG image support\"))
            (unless (and (require 'mathjax nil t)
                         (mathjax-available-p))
              (error \"MathJax or Node.js is unavailable\")))"

      - name: Install optional Mermaid CLI
        if: matrix.svg
        run: |
          chrome="$(command -v google-chrome)"
          test -x "$chrome"
          PUPPETEER_SKIP_DOWNLOAD=true npm install --prefix "$RUNNER_TEMP/mermaid" @mermaid-js/mermaid-cli
          echo "$RUNNER_TEMP/mermaid/node_modules/.bin" >> "$GITHUB_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Byte-compile
        run: |
          emacs --batch -Q \
            --eval '(progn (require (quote package)) (package-initialize))' \
            -L . \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile \
            markdown-ts-appear-compat.el \
            markdown-ts-appear-image.el \
            markdown-ts-appear-math.el \
            markdown-ts-appear-diagram.el \
            markdown-ts-appear-table.el \
            markdown-ts-appear.el

      - name: Check documentation
        run: |
          emacs --batch -Q --eval "(progn
            (require 'package)
            (package-initialize)
            (require 'checkdoc)
            (dolist (file '(\"markdown-ts-appear.el\"
                            \"markdown-ts-appear-compat.el\"
                            \"markdown-ts-appear-image.el\"
                            \"markdown-ts-appear-math.el\"
                            \"markdown-ts-appear-diagram.el\"
                            \"markdown-ts-appear-table.el\"))
              (find-file file)
              (checkdoc-current-buffer t))
            (when-let* ((warnings (get-buffer \"*Warnings*\"))
                        ((> (buffer-size warnings) 0)))
              (with-current-buffer warnings
                (princ (buffer-string)))
              (kill-emacs 1)))"

      - name: Run tests
        timeout-minutes: 10
        env:
          MARKDOWN_TS_APPEAR_REQUIRE_GRAMMARS: "1"
          MARKDOWN_TS_APPEAR_REQUIRE_MATHJAX: ${{ matrix.svg }}
          MARKDOWN_TS_APPEAR_REQUIRE_MERMAID: ${{ matrix.svg }}
        run: |
          emacs --batch -Q -l test/run-tests.el

      - name: Check real terminal cursor and Evil insert transitions
        run: |
          python3 -B -m unittest discover -s test -p 'test_*.py'
          python3 test/table-redisplay.py

  package-lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: purcell/setup-emacs@master
        with:
          version: snapshot

      - name: Run package-lint
        run: |
          emacs --batch -Q \
            --eval "(progn
              (require 'package)
              (add-to-list 'package-archives
                           '(\"melpa\" . \"https://melpa.org/packages/\") t)
              (package-initialize)
              (package-refresh-contents)
              (package-install 'package-lint)
              (require 'package-lint)
              (setq package-lint-main-file \"markdown-ts-appear.el\")
              (find-file \"markdown-ts-appear.el\")
              (let ((issues (package-lint-buffer)))
                (dolist (issue issues)
                  (message \"markdown-ts-appear.el:%d:%d: %s: %s\"
                           (nth 0 issue) (nth 1 issue)
                           (nth 2 issue) (nth 3 issue)))
                (kill-emacs (if issues 1 0))))"

  melpazoid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Prepare melpazoid
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox
          git clone --depth 1 https://github.com/riscy/melpazoid.git "$RUNNER_TEMP/melpazoid"

      - name: Check package
        env:
          LOCAL_REPO: ${{ github.workspace }}
          RECIPE: '(markdown-ts-appear :fetcher github :repo "Thysrael/markdown-ts-appear")'
          EXIST_OK: "true"
          WARN_IS_ERROR: "false"
        run: make -C "$RUNNER_TEMP/melpazoid"
