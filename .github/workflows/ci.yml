name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs-version }} / grammar ${{ matrix.grammar-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - emacs-version: "31.1"
            grammar-version: pinned
            grammar-commit: "413285231ce8fa8b11e7074bbe265b48aa7277f9"
          - emacs-version: "31.1"
            grammar-version: latest
            grammar-commit: ""
          - emacs-version: snapshot
            grammar-version: pinned
            grammar-commit: "413285231ce8fa8b11e7074bbe265b48aa7277f9"
          - emacs-version: snapshot
            grammar-version: latest
            grammar-commit: ""

    steps:
      - uses: actions/checkout@v5

      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Install Tree-sitter grammars
        env:
          MARKDOWN_GRAMMAR_COMMIT: ${{ matrix.grammar-commit }}
        run: |
          emacs --batch -Q --eval "(progn
            (require 'treesit)
            (require 'subr-x)
            (let* ((commit (getenv \"MARKDOWN_GRAMMAR_COMMIT\"))
                   (revision (unless (string-empty-p commit)
                               (list :commit commit)))
                   (repository
                    \"https://github.com/tree-sitter-grammars/tree-sitter-markdown\"))
              (setq treesit-language-source-alist
                    (list
                     (cons 'markdown
                           (append (list repository) revision
                                   (list :source-dir
                                         \"tree-sitter-markdown/src\")))
                     (cons 'markdown-inline
                           (append (list repository) revision
                                   (list :source-dir
                                         \"tree-sitter-markdown-inline/src\")))
                     '(c
                       \"https://github.com/tree-sitter/tree-sitter-c\"
                       :commit \"3aa2995549d5d8b26928e8d3fa2770fd4327414e\"))))
            (mapc #'treesit-install-language-grammar
                  '(markdown markdown-inline c))
            (unless (treesit-ready-p '(markdown markdown-inline c))
              (error \"Required Tree-sitter grammars are unavailable\"))))"

      - name: Install package dependencies
        run: |
          emacs --batch -Q --eval "(progn
            (require 'package)
            (package-refresh-contents)
            (package-install 'mathjax)
            (unless (and (require 'mathjax nil t)
                         (mathjax-available-p))
              (error \"MathJax or Node.js is unavailable\")))"

      - name: Byte-compile
        run: |
          emacs --batch -Q -L . \
            --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile markdown-ts-appear.el

      - name: Check documentation
        run: |
          emacs --batch -Q --eval "(progn
            (require 'checkdoc)
            (find-file \"markdown-ts-appear.el\")
            (checkdoc-current-buffer t)
            (when-let* ((warnings (get-buffer \"*Warnings*\"))
                        ((> (buffer-size warnings) 0)))
              (with-current-buffer warnings
                (princ (buffer-string)))
              (kill-emacs 1)))"

      - name: Run tests
        env:
          MARKDOWN_TS_APPEAR_REQUIRE_GRAMMARS: "1"
          MARKDOWN_TS_APPEAR_REQUIRE_MATHJAX: "1"
        run: |
          emacs --batch -Q -L . \
            --eval '(progn (require (quote package)) (package-initialize))' \
            -l test/markdown-ts-appear-test.el \
            -f ert-run-tests-batch-and-exit

  package-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: purcell/setup-emacs@master
        with:
          version: snapshot

      - name: Run package-lint
        run: |
          emacs --batch -Q \
            --eval "(progn
              (require 'package)
              (add-to-list 'package-archives
                           '(\"melpa\" . \"https://melpa.org/packages/\") t)
              (package-initialize)
              (package-refresh-contents)
              (package-install 'package-lint)
              (require 'package-lint)
              (setq package-lint-main-file \"markdown-ts-appear.el\")
              (find-file \"markdown-ts-appear.el\")
              ;; package-lint 0.26 predates the Emacs 31.1 release.
              (let ((issues
                     (seq-remove
                      (lambda (issue)
                        (equal
                         (nth 3 issue)
                         \"This makes the package uninstallable in all released Emacs versions.\"))
                      (package-lint-buffer))))
                (dolist (issue issues)
                  (message \"markdown-ts-appear.el:%d:%d: %s: %s\"
                           (nth 0 issue) (nth 1 issue)
                           (nth 2 issue) (nth 3 issue)))
                (kill-emacs (if issues 1 0))))"
